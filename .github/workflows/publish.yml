name: publish

# npm trusted publishing (OIDC): no npm token, no 2FA bypass token.
# Configure it once on npmjs.com: the package -> Settings -> Trusted publishing
# -> GitHub repo `imaused/dsh-kb-lite`, workflow `publish.yml`.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
